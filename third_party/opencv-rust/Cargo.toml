# qqcode patch: with only a few modules enabled these fire in the crate's own sources, and as a path
# dependency its warnings are not capped
[lints.rust]
unused_imports = "allow"
unused_macros = "allow"
unfulfilled_lint_expectations = "allow"

[lib]
name = "opencv"
path = "src/lib.rs"
doctest = false

# qqcode patch: the `[[example]]` and `[[test]]` sections that stood here are taken out, as `examples/` and
# `tests/` are not in this copy and `cargo fmt --all` in the parent workspace fails on a target whose file is
# missing

# qqcode patch: OpenCV itself is compiled from third_party/opencv by `opencv-vendored`. Depending on it makes
# cargo finish that build before this crate's build script runs and hands its location over as
# `DEP_OPENCV_VENDORED_*`.
[dependencies.opencv-vendored]
