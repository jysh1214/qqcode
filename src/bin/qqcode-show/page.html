<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  html, body { height: 100%; margin: 0; }
  /* light all around the matrix: a camera sets its exposure by the whole frame */
  body { background: #fff; color: #222; font: 14px/1.4 system-ui, sans-serif; display: flex;
         flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; margin: 12px; }
  #notes { text-align: center; padding: 0 12px 8px; max-width: 70em; }
  #notes p { margin: 2px 0; }
  #say { font-weight: 600; }
  #keys, #facts { color: #666; }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="notes"><p id="say"></p><p id="pick" hidden><input id="chosen" type="file"></p><p id="facts"></p><p id="keys"></p></div>
<script id="meta" type="application/json">{{META}}</script>
<script id="file" type="application/octet-stream">{{FILE}}</script>
<script>
"use strict";
// What qqcode-show computes in Rust for its tests is computed here for the screen: src/tiles.rs,
// src/fountain.rs, src/packet.rs and src/ldpc.rs say why, this says it again in JavaScript, and the two have
// to agree to the bit.

// ---- the check bits of a frame, src/ldpc.rs
// the sequence of numbers that a code is made from
function draw(seed) {
  let state = seed | 0;
  return () => {
    state ^= state << 13;
    state ^= state >>> 17;
    state ^= state << 5;
    return state >>> 0;
  };
}

// the numbers from 0 to `count` less one, in no order
function order(next, count) {
  const order = new Uint32Array(count);
  for (let index = 0; index < count; index++) order[index] = index;
  for (let last = count - 1; last >= 1; last--) {
    const other = next() % (last + 1), kept = order[last];
    order[last] = order[other];
    order[other] = kept;
  }
  return order;
}

// a code of words of `bits` bits, of which `data` are data: which bits of the data each check has
class Code {
  constructor(bits, data) {
    const few = 3, many = 13, more = 10, checks = bits - data, next = draw(0x2545f491);
    const ofBit = new Int32Array(data * many).fill(-1), sizes = new Uint32Array(checks);
    let turn = 0;
    for (let round = 0; round < many; round++) {
      for (const bit of order(next, round < few ? data : Math.floor(data / more))) {
        const own = ofBit.subarray(bit * many, bit * many + round);
        let check = turn % checks;
        // a bit that would come into a check twice takes the next check
        while (own.includes(check)) check = (check + 1) % checks;
        ofBit[bit * many + round] = check;
        sizes[check]++;
        turn++;
      }
    }
    this.bits = bits;
    this.data = data;
    this.starts = new Uint32Array(checks + 1);
    for (let check = 0; check < checks; check++) this.starts[check + 1] = this.starts[check] + sizes[check];
    this.members = new Uint32Array(this.starts[checks]);
    const filled = new Uint32Array(checks);
    for (let bit = 0; bit < data; bit++) {
      for (let round = 0; round < many; round++) {
        const check = ofBit[bit * many + round];
        if (check >= 0) this.members[this.starts[check] + filled[check]++] = bit;
      }
    }
  }

  // the code word of the bits of these bytes, a byte for every bit: the data, and then for every check
  // the check bit before it plus the bits of the data that the check has
  encode(bytes) {
    const word = new Uint8Array(this.bits), checks = this.bits - this.data;
    for (let bit = 0; bit < this.data; bit++) word[bit] = (bytes[bit >> 3] >> (7 - (bit & 7))) & 1;
    let before = 0;
    for (let check = 0; check < checks; check++) {
      for (let at = this.starts[check]; at < this.starts[check + 1]; at++) before ^= word[this.members[at]];
      word[this.data + check] = before;
    }
    return word;
  }
}

// ---- the tiles of a frame, src/tiles.rs
function mix(bytes, state) {
  for (let index = 0; index < bytes.length; index++) {
    state ^= state << 13;
    state ^= state >>> 17;
    state ^= state << 5;
    bytes[index] ^= state & 0xff;
  }
  return state;
}

class Matrix {
  constructor(shape) {
    Object.assign(this, shape);
    this.width = 2 * this.border + this.columns * this.pitch;
    this.height = 2 * this.border + this.rows * this.pitch;
    this.cells = [];
    for (let row = 0; row < this.rows; row++) {
      for (let column = 0; column < this.columns; column++) {
        const corner = (column < this.anchor || column >= this.columns - this.anchor) &&
                       (row < this.anchor || row >= this.rows - this.anchor);
        if (!corner) this.cells.push([this.border + column * this.pitch, this.border + row * this.pitch]);
      }
    }
    this.tiles = this.cells.length;
    this.capacity = Math.floor(Math.floor(this.tiles * this.bits * this.data[0] / this.data[1]) / 8);
    this.code = new Code(this.tiles * this.bits, 8 * this.capacity);
    // the place among the bits of the tiles that each bit of a code word has
    this.places = order(draw(0x6c078965), this.tiles * this.bits);
  }

  // the tiles of the frame that holds `payload`: its symbol times four plus its colour for every cell
  pack(payload) {
    const word = this.code.encode(payload), tiles = new Uint8Array(this.tiles);
    for (let bit = 0; bit < word.length; bit++) {
      if (word[bit]) tiles[Math.floor(this.places[bit] / this.bits)] |= 1 << (this.bits - 1 - this.places[bit] % this.bits);
    }
    mix(tiles, 0x9e3779b9 | 0);
    for (let tile = 0; tile < tiles.length; tile++) tiles[tile] &= 63;
    return tiles;
  }
}

// ---- what a frame says, src/packet.rs
const CRC = new Uint32Array(256);
for (let byte = 0; byte < 256; byte++) {
  let remainder = byte;
  for (let bit = 0; bit < 8; bit++) remainder = remainder & 1 ? 0xedb88320 ^ (remainder >>> 1) : remainder >>> 1;
  CRC[byte] = remainder >>> 0;
}

function checksum(bytes) {
  let crc = 0xffffffff;
  for (let index = 0; index < bytes.length; index++) crc = CRC[(crc ^ bytes[index]) & 0xff] ^ (crc >>> 8);
  return ~crc >>> 0;
}

function frameBytes(capacity, origin, kind, block, sequence, body) {
  const frame = new Uint8Array(capacity), view = new DataView(frame.buffer);
  frame[0] = frame[1] = 0x71;
  frame[2] = kind;
  view.setUint32(3, origin.checksum);
  view.setUint32(7, Math.floor(origin.length / 0x100000000));
  view.setUint32(11, origin.length >>> 0);
  view.setUint32(15, block);
  view.setUint32(19, sequence);
  frame.set(body, 23);
  view.setUint32(capacity - 4, checksum(frame.subarray(0, capacity - 4)));
  return frame;
}

function startFrame(capacity, origin, name) {
  let bytes = new TextEncoder().encode(name), end = Math.min(bytes.length, capacity - 27 - 2, 0xffff);
  // cut between two characters
  while (end < bytes.length && (bytes[end] & 0xc0) === 0x80) end--;
  bytes = bytes.subarray(0, end);
  const body = new Uint8Array(2 + bytes.length);
  body[0] = bytes.length >> 8;
  body[1] = bytes.length & 0xff;
  body.set(bytes, 2);
  return frameBytes(capacity, origin, 0x10, 0, 0, body);
}

// ---- the packets of a file, src/fountain.rs
function stir(value) {
  value ^= value >>> 16;
  value = Math.imul(value, 0x85ebca6b);
  value ^= value >>> 13;
  value = Math.imul(value, 0xc2b2ae35);
  return (value ^ (value >>> 16)) >>> 0;
}

// which symbols of a block of `size` the packet `sequence` is the sum of, 32 to a word
function terms(fileChecksum, block, sequence, size) {
  const words = new Uint32Array(Math.ceil(size / 32));
  if (sequence < size) {
    words[sequence >>> 5] = 1 << (sequence & 31);
    return words;
  }
  const seed = stir(fileChecksum ^ Math.imul(block, 0x9e3779b1) ^ Math.imul(sequence, 0x85ebca6b));
  let any = false;
  for (let half = 0; half < words.length; half++) {
    let word = stir((seed + Math.imul(half + 1, 0x9e3779b9)) | 0);
    const spare = Math.max(0, 32 * (half + 1) - size);
    if (spare > 0) word = (word & (0xffffffff >>> spare)) >>> 0;
    any = any || word !== 0;
    words[half] = word;
  }
  if (!any && size > 0) words[0] = 1;
  return words;
}

class Fountain {
  // `read(from, to)` promises the bytes of the file from `from` up to `to`; `plan` says how many symbols
  // a block has at most, how many blocks a group, and how many sums in a hundred a round has to spare
  constructor(read, origin, symbol, plan) {
    this.read = read;
    this.origin = origin;
    this.symbol = symbol;
    this.perGroup = plan.group;
    const symbols = Math.ceil(origin.length / symbol), count = Math.max(1, Math.ceil(symbols / plan.block));
    this.symbols = symbols;
    this.blocks = [];
    for (let block = 0, from = 0; block < count; block++) {
      const size = Math.floor(symbols / count) + (block < symbols % count ? 1 : 0);
      this.blocks.push([from, size]);
      from += size;
    }
    // The order of the show: group by group, each block of a group its packets and the sums to spare.
    // That is the first round; the rounds after it show sums alone, as many as the first had to spare.
    this.groups = Math.ceil(count / plan.group);
    this.each = { first: [], later: [] };
    this.starts = { first: [0], later: [0] };
    for (let group = 0; group < this.groups; group++) {
      const blocks = Math.min(plan.group * (group + 1), count) - plan.group * group;
      const size = this.blocks[plan.group * group][1];
      const each = {
        first: Math.floor((size * (100 + plan.spare) + 99) / 100),
        later: Math.floor((size * Math.max(plan.spare, plan.again) + 99) / 100),
      };
      for (const round of ["first", "later"]) {
        this.each[round].push(each[round]);
        this.starts[round].push(this.starts[round][group] + blocks * each[round]);
      }
    }
    this.round = this.starts.first[this.groups];
    this.again = this.starts.later[this.groups];
    // the bytes of the groups that are on show or about to be: all that is kept of the file
    this.held = new Map();
    this.loading = new Map();
  }

  // the group, the block and the place in its sequence of the packet in frame `frame`
  turn(frame) {
    if (this.round === 0) return [0, 0, frame >>> 0];
    // which round, how far into it, and where the groups begin in a round of that kind
    const later = frame >= this.round, rest = frame - this.round;
    const rounds = later ? Math.floor(rest / this.again) : 0, within = later ? rest % this.again : frame;
    const starts = later ? this.starts.later : this.starts.first;
    let low = 0, high = this.groups - 1;
    while (low < high) {
      const middle = (low + high + 1) >> 1;
      if (starts[middle] <= within) low = middle; else high = middle - 1;
    }
    const first = this.perGroup * low, blocks = Math.min(first + this.perGroup, this.blocks.length) - first;
    const turn = within - starts[low];
    // the sums of a later round follow those of all the rounds before it
    const before = later ? this.each.first[low] + rounds * this.each.later[low] : 0;
    return [low, first + turn % blocks, (before + Math.floor(turn / blocks)) >>> 0];
  }

  // promises that the bytes of a group are held; those of other groups than `keep` are let go
  load(group, keep) {
    for (const other of this.held.keys()) if (other !== group && other !== keep) this.held.delete(other);
    if (this.held.has(group)) return Promise.resolve();
    if (!this.loading.has(group)) {
      const first = this.perGroup * group, last = Math.min(first + this.perGroup, this.blocks.length) - 1;
      const from = this.blocks[first][0] * this.symbol;
      const to = Math.min((this.blocks[last][0] + this.blocks[last][1]) * this.symbol, this.origin.length);
      this.loading.set(group, this.read(from, to).then((bytes) => {
        this.held.set(group, { from, bytes });
        this.loading.delete(group);
      }, (error) => {
        this.loading.delete(group);
        throw error;
      }));
    }
    return this.loading.get(group);
  }

  ready(frame) {
    return this.held.has(this.turn(frame)[0]);
  }

  // promises what the frame `frame` takes, and begins to fetch what the frames some way ahead will
  prepare(frame, ahead = 0) {
    const group = this.turn(frame)[0], next = this.turn(frame + ahead)[0];
    const ready = this.load(group, next);
    if (next !== group) this.load(next, group).catch(() => {});
    return ready;
  }

  packet(group, block, sequence) {
    const [first, size] = this.blocks[block], packet = new Uint8Array(this.symbol);
    const { from: held, bytes } = this.held.get(group);
    const words = terms(this.origin.checksum, block, sequence, size);
    for (let half = 0; half < words.length; half++) {
      for (let bit = 0, word = words[half]; word; bit++, word >>>= 1) {
        if (!(word & 1)) continue;
        // the last symbol of the file ends where the file ends
        const from = (first + 32 * half + bit) * this.symbol - held, to = Math.min(from + this.symbol, bytes.length);
        for (let at = from; at < to; at++) packet[at - from] ^= bytes[at];
      }
    }
    return packet;
  }
}

// ---- the show
class Show {
  constructor(meta, read) {
    this.meta = meta;
    this.matrix = new Matrix(meta.matrix);
    this.origin = { checksum: meta.checksum, length: meta.length };
    this.fountain = new Fountain(read, this.origin, this.matrix.capacity - 27, meta.plan);
  }

  // the bytes of the start screen, and of the frame `frame` of the file
  start() {
    return startFrame(this.matrix.capacity, this.origin, this.meta.name);
  }

  // what frame() needs of the file is to be asked for first, and waited for
  prepare(frame, ahead) {
    return this.fountain.prepare(frame, ahead);
  }

  ready(frame) {
    return this.fountain.ready(frame);
  }

  frame(frame) {
    const [group, block, sequence] = this.fountain.turn(frame);
    const packet = this.fountain.packet(group, block, sequence);
    return frameBytes(this.matrix.capacity, this.origin, 0x11, block, sequence, packet);
  }

  tiles(frame) {
    return this.matrix.pack(frame === null ? this.start() : this.frame(frame));
  }
}

function fileBytes(text) {
  text = text.trim();
  if (Uint8Array.fromBase64) return Uint8Array.fromBase64(text);
  const binary = atob(text), bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
  return bytes;
}

// the file as the page holds it, and as it is fetched from where the browser was told it is
const held = (bytes) => (from, to) => Promise.resolve(bytes.subarray(from, to));
const fetched = (file) => async (from, to) => new Uint8Array(await file.slice(from, to).arrayBuffer());

// the checksum of a file that is read piece by piece, which `progress` is told the bytes of
async function fileChecksum(file, progress) {
  let crc = 0xffffffff;
  for (let at = 0; at < file.size; at += 1 << 25) {
    const bytes = new Uint8Array(await file.slice(at, at + (1 << 25)).arrayBuffer());
    for (let index = 0; index < bytes.length; index++) crc = CRC[(crc ^ bytes[index]) & 0xff] ^ (crc >>> 8);
    progress(at + bytes.length);
  }
  return ~crc >>> 0;
}

// ---- the screen
// The frames a second that + and - go through: one more or one less at a time, from 1 to 60, which is
// as far as --rate goes.
const faster = (pace) => Math.min(pace + 1, 60);
const slower = (pace) => Math.max(pace - 1, 1);

function run() {
  const meta = JSON.parse(document.getElementById("meta").textContent);
  const say = document.getElementById("say");
  if (meta.embedded) {
    begin(meta, held(fileBytes(document.getElementById("file").textContent)));
    return;
  }
  // the page was written for a file that it does not hold: the browser has to be told where it is
  const pick = document.getElementById("pick"), chosen = document.getElementById("chosen");
  const size = meta.length === 1 ? "1 byte" : `${meta.length} bytes`;
  pick.hidden = false;
  say.textContent = `This page shows ${meta.name}, ${size}, which it does not hold: choose that file, or drop it here.`;
  let busy = false;
  async function take(file) {
    if (!file || busy) return;
    if (file.size !== meta.length) {
      say.textContent = `${file.name} has ${file.size} bytes, and the page was written for ${meta.name} with ${size}.`;
      return;
    }
    busy = true;
    try {
      const checksum = await fileChecksum(file, (read) => {
        say.textContent = `Reading ${file.name}: ${Math.floor(100 * read / Math.max(1, file.size))} %`;
      });
      if (checksum !== meta.checksum) {
        say.textContent = `${file.name} is as long as ${meta.name} and is not that file: the page was written for another one.`;
        return;
      }
      pick.hidden = true;
      begin(meta, fetched(file));
    } catch (error) {
      say.textContent = `${file.name} can't be read: ${error.message}`;
    } finally {
      busy = false;
    }
  }
  chosen.addEventListener("change", () => take(chosen.files[0]));
  window.addEventListener("dragover", (event) => event.preventDefault());
  window.addEventListener("drop", (event) => {
    event.preventDefault();
    take(event.dataTransfer.files[0]);
  });
  window.qqcode = { take };
}

function begin(meta, read) {
  const show = new Show(meta, read);
  const matrix = show.matrix, canvas = document.getElementById("matrix");
  canvas.width = matrix.width;
  canvas.height = matrix.height;
  const context = canvas.getContext("2d"), image = context.createImageData(matrix.width, matrix.height);
  const pixels = new Uint32Array(image.data.buffer);
  // red, green, blue and full opacity as the bytes of a pixel lie in memory
  const little = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;
  const colour = ([red, green, blue]) =>
    (little ? 0xff000000 | blue << 16 | green << 8 | red : red << 24 | green << 16 | blue << 8 | 0xff) >>> 0;
  const dark = colour([0, 0, 0]), light = colour([255, 255, 255]), colours = meta.colours.map(colour);
  const fill = (left, top, side, value) => {
    for (let y = top; y < top + side; y++) pixels.fill(value, y * matrix.width + left, y * matrix.width + left + side);
  };
  // which of the sixteen sub-cells of each symbol are lit: where its two waves differ, or do not
  const waves = [[0, 0, 0, 0], [0, 0, 1, 1], [0, 1, 1, 0]];
  const patterns = [[0, 1], [1, 0], [1, 1], [0, 2], [2, 0], [1, 2], [2, 1], [2, 2]];
  const lit = [];
  for (let symbol = 0; symbol < 16; symbol++) {
    const [down, across] = patterns[symbol & 7], cells = [];
    for (let cell = 0; cell < 16; cell++) {
      if (waves[down][cell >> 2] ^ waves[across][cell & 3] ^ (symbol >> 3)) cells.push([matrix.sub * (cell & 3), matrix.sub * (cell >> 2)]);
    }
    lit.push(cells);
  }

  function draw(tiles) {
    pixels.fill(dark);
    // the finder patterns: dark, light, dark squares of 7, 5 and 3 modules in a light square
    const square = matrix.anchor * matrix.pitch, inset = (square - 7 * matrix.module) / 2, m = matrix.module;
    const farX = matrix.border + (matrix.columns - matrix.anchor) * matrix.pitch;
    const farY = matrix.border + (matrix.rows - matrix.anchor) * matrix.pitch;
    for (const [left, top] of [[matrix.border, matrix.border], [farX, matrix.border], [farX, farY], [matrix.border, farY]]) {
      fill(left, top, square, light);
      fill(left + inset, top + inset, 7 * m, dark);
      fill(left + inset + m, top + inset + m, 5 * m, light);
      fill(left + inset + 2 * m, top + inset + 2 * m, 3 * m, dark);
    }
    for (let tile = 0; tile < tiles.length; tile++) {
      const [left, top] = matrix.cells[tile], value = colours[tiles[tile] & 3];
      for (const [x, y] of lit[tiles[tile] >> 2]) fill(left + x, top + y, matrix.sub, value);
    }
    context.putImageData(image, 0, 0);
  }

  // as large as the window has room for, in whole pixels of the screen for a pixel of the matrix where
  // that is possible
  const notes = document.getElementById("notes");
  function fit() {
    const room = [window.innerWidth - 24, window.innerHeight - 24 - (notes.hidden ? 0 : notes.offsetHeight)];
    let scale = Math.min(room[0] / matrix.width, room[1] / matrix.height);
    const whole = Math.floor(scale * devicePixelRatio) / devicePixelRatio;
    if (whole >= 1 / devicePixelRatio) scale = whole;
    canvas.style.width = `${matrix.width * scale}px`;
    canvas.style.height = `${matrix.height * scale}px`;
  }

  const state ={ frame: null, playing: false, pace: meta.pace, shown: 0, since: 0, trouble: "" };
  const size = show.origin.length === 1 ? "1 byte" : `${show.origin.length} bytes`;
  const fountain = show.fountain, packets = fountain.symbols;
  function tell() {
    const seconds = Math.ceil(fountain.round / state.pace);
    let where = "";
    if (state.frame !== null) {
      const round = state.frame < fountain.round ? 1 : 2 + Math.floor((state.frame - fountain.round) / fountain.again);
      const group = fountain.turn(state.frame)[0] + 1;
      where = `frame ${state.frame + 1}, round ${round}` + (fountain.groups > 1 ? `, part ${group} of ${fountain.groups}` : "");
    }
    document.getElementById("say").textContent = state.trouble || (state.frame === null
      ? `Ready to show ${meta.name}: ${size}. Point the camera at this; qqcode says so when it has it in view. Enter starts.`
      : `${meta.name}: ${where}${state.playing ? "" : ", paused"}`);
    document.getElementById("facts").textContent =
      `${matrix.columns}x${matrix.rows} tiles, ${matrix.capacity - 27} bytes a frame, ${state.pace} frames a second: ` +
      `${packets} frames make the file, the first round of ${fountain.round} takes ${seconds} s`;
    document.getElementById("keys").textContent =
      "enter/space start, pause   + - faster, slower   g start screen   f full screen   h hide these notes";
  }

  // what the frames of the next seconds take of the file is fetched while those before them are on show
  const ahead = () => 5 * state.pace;
  const fetching = (frame) => show.prepare(frame, ahead()).then(() => {
    state.trouble = "";
  }, (error) => {
    state.trouble = `The file can't be read: ${error.message}`;
    state.playing = false;
    tell();
  });

  function step(now) {
    requestAnimationFrame(step);
    if (!state.playing || now - state.since < 1000 / state.pace - 2) return;
    const next = state.frame === null ? 0 : state.frame + 1;
    fetching(next);
    // the frame on show stays for as long as the next one waits for the file
    if (!show.ready(next)) return;
    state.since = now;
    state.frame = next;
    draw(show.tiles(next));
    // the words change a few times a second, the picture as often as it is told to
    if (now - state.shown > 250) {
      state.shown = now;
      tell();
    }
  }

  window.addEventListener("keydown", (event) => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.key === "Enter" || event.key === " ") {
      // a file without a byte has nothing but its start screen
      state.playing = !state.playing && packets > 0;
      if (state.playing) fetching(state.frame === null ? 0 : state.frame + 1);
    } else if (event.key === "+" || event.key === "=") {
      state.pace = faster(state.pace);
    } else if (event.key === "-" || event.key === "_") {
      state.pace = slower(state.pace);
    } else if (event.key === "g") {
      state.playing = false;
      state.frame = null;
      draw(show.tiles(null));
    } else if (event.key === "f") {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    } else if (event.key === "h") {
      notes.hidden = !notes.hidden;
      fit();
    } else {
      return;
    }
    event.preventDefault();
    tell();
  });
  window.addEventListener("resize", fit);
  draw(show.tiles(null));
  tell();
  fit();
  requestAnimationFrame(step);
  // for whoever drives the page from outside, as its tests do
  window.qqcode = { show, state, draw, tell };
}

if (typeof document !== "undefined") run();
</script>
