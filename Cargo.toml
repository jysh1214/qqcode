[workspace]
members = ["crates/opencv-vendored"]
# third_party/opencv-rust is a dependency, not something `cargo test --workspace` should build on its own
exclude = ["third_party"]
resolver = "3"

[package]
name = "qqcode"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
# the package also builds `qqcode-show`, see src/bin
default-run = "qqcode"
description = "Carries a file from a screen to a camera as a matrix of coloured tiles"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# drawing the preview on the terminal and reading its keys
crossterm = { version = "0.29", default-features = false, features = ["events"] }
# puts the standard error aside while the preview has the terminal; crossterm brings the crate along anyway
rustix = { version = "1", default-features = false, features = ["std", "stdio"] }
# Bindings for the OpenCV that `opencv-vendored` builds from third_party/opencv (see third_party/README.md)
# "clang-runtime": the build script looks libclang up when it runs instead of linking against it, so a
# libclang outside the dynamic loader's search path works too
opencv = { path = "third_party/opencv-rust", default-features = false, features = [
    "clang-runtime",
    "imgcodecs",
    "imgproc",
    "videoio",
] }
opencv-vendored = { path = "crates/opencv-vendored" }
# finds the finder patterns in a frame, which the matrix has in its corners and which are those of a QR
# code: of the many kinds of codes it reads, the QR reader alone, and none of the character sets that the
# text of a code may be in, as no text is read
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "no_character_set_support",
    "qrcode",
] }
# the MD5 and the SHA-256 that both programs print of the file when they end
md-5 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
